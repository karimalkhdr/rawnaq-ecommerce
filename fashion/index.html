
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAWNAQ FASHION</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Cairo, sans-serif;
      background: #faf8f5;
      color: #28241f;
      text-align: center;
    }
    header {
      padding: 25px;
      background: white;
      border-bottom: 1px solid #eee;
    }
    h1 { letter-spacing: 2px; }
    h1 span { color: #b99a5d; }
    main { padding: 90px 20px; }
    h2 { font-size: 35px; }
    p { color: #777; line-height: 2; }
    a {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 28px;
      background: #28241f;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>RAWNAQ <span>FASHION</span></h1>
  </header>
  <main>
    <h2>أناقتك تبدأ من هنا</h2>
    <p>مرحباً بك في عالم RAWNAQ FASHION</p>
    <a href="/">العودة إلى الصفحة الرئيسية</a>
  </main>
</body>
</html>
